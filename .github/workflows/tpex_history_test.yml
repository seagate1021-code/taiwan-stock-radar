
name: TPEx History Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tpex-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pandas numpy pyyaml requests

      - name: Build TPEx history
        run: |
          python src/tpex_history.py
            
      - name: Upload TPEx test CSV files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-history-indicators-test
          path: |
            data/history/tpex_daily.csv
            data/history/tpex_technical_indicators.csv
          if-no-files-found: error
    
