
name: TPEx History Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-tpex-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pandas numpy pyyaml requests

      - name: Build TPEx history
        run: |
          python src/tpex_history.py
          
      - name: Commit updated TPEx history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/tpex_daily.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update TPEx historical prices"
            git push
          else
            echo "No TPEx history changes to commit"
          fi 
          
      - name: Upload TPEx test CSV files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tpex-history-indicators-test
          path: |
            data/history/tpex_daily.csv
          if-no-files-found: error
    
