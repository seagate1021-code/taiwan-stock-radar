
name: Taiwan Stock Radar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock radar
        run: python main.py

      - name: Fetch TWSE market data
        run: python src/twse.py

      - name: Upload market data
        uses: actions/upload-artifact@v4
        with:
          name: twse-market-data
          path: data/reports/twse_latest.csv
