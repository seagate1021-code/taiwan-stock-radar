

name: Taiwan Stock Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

jobs:
  stock_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock radar
        run: python main.py

      - name: Fetch TWSE market data
        run: python src/twse.py

      - name: Upload market data
        uses: actions/upload-artifact@v4
        with:
          name: twse-market-data
          path: data/reports/twse_latest.csv

      - name: Build TWSE history
        run: python src/history.py

      - name: Backfill historical volume
        run: python src/backfill_volume.py
        
      - name: Run basic stock screener
        run: python src/screener.py
        
      - name: Calculate technical indicators
        run: python src/indicators.py

      - name: Classify stock signals
        run: python src/signals.py

      - name: Rank FIRE top picks
        run: python src/top_picks.py

      - name: Test TDCC API
        run: python src/tdcc_test.py

      - name: Build TDCC weekly snapshot
        run: python src/tdcc_snapshot.py
        
      - name: Backfill TDCC history
        run: python src/tdcc_backfill.py

      - name: Analyze TDCC 12-week trend
        run: python src/tdcc_analysis.py
        
      - name: Enrich FIRE picks with TDCC
        run: python src/tdcc_enrich.py
        
      - name: Confirm FIRE with TDCC
        run: python src/tdcc_confirmed.py
        
      - name: Upload FIRE TDCC confirmed picks
        uses: actions/upload-artifact@v4
        with:
          name: fire-tdcc-confirmed
          path: data/reports/tdcc_confirmed.csv
          if-no-files-found: error
       
      - name: Check TDCC historical dates
        run: python src/tdcc_history_check.py
        
      - name: Test TDCC historical archive
        run: python src/tdcc_archive_test.py
        
      - name: Upload FIRE top picks
        uses: actions/upload-artifact@v4
        with:
          name: fire-top-picks
          path: data/reports/top_picks.csv

      - name: Upload stock signals
        uses: actions/upload-artifact@v4
        with:
          name: stock-signals
          path: data/reports/stock_signals.csv

      - name: Upload technical indicators
        uses: actions/upload-artifact@v4
        with:
          name: technical-indicators
          path: data/reports/technical_indicators.csv

      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: basic-screen-results
          path: data/reports/basic_screen.csv

      - name: Upload history data
        uses: actions/upload-artifact@v4
        with:
          name: twse-history-data
          path: data/history/twse_daily.csv

      - name: Save history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/twse_daily.csv data/history/tdcc_weekly.csv
          if git diff --cached --quiet; then
            echo "沒有新的歷史資料需要儲存"
          else
            git commit -m "Update TWSE and TDCC historical data"
            git push
          fi
