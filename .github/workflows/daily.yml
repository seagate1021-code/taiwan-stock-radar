
name: Taiwan Stock Radar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stock_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock radar
        run: python main.py

      - name: Fetch TWSE market data
        run: python src/twse.py

      - name: Upload market data
        uses: actions/upload-artifact@v4
        with:
          name: twse-market-data
          path: data/reports/twse_latest.csv

      - name: Build TWSE history
        run: python src/history.py

      - name: Backfill historical volume
        run: python src/backfill_volume.py

      - name: Calculate technical indicators
        run: python src/indicators.py

      - name: Upload technical indicators
        uses: actions/upload-artifact@v4
        with:
          name: technical-indicators
          path: data/reports/technical_indicators.csv

      - name: Run basic stock screener
        run: python src/screener.py

      - name: Upload screening results
        uses: actions/upload-artifact@v4
        with:
          name: basic-screen-results
          path: data/reports/basic_screen.csv

      - name: Upload history data
        uses: actions/upload-artifact@v4
        with:
          name: twse-history-data
          path: data/history/twse_daily.csv

      - name: Save history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/twse_daily.csv
          if git diff --cached --quiet; then
            echo "沒有新的歷史資料需要儲存"
          else
            git commit -m "Update TWSE historical data"
            git push
          fi
